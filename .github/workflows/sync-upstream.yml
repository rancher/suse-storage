name: Sync with Upstream

on:
  schedule:
  - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: repo-sync
      uses: rancher/gh-issue-mgr/github-sync@343718ca0f6d3c44c8438058d4287d6f358c899c
      with:
        source_repo: "https://github.com/longhorn/longhorn.git"
        source_branch: "v*.*.x"
        destination_branch: "v*.*.x"
        sync_tags: "false"
        github_token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
    - name: repo-sync-master
      uses: rancher/gh-issue-mgr/github-sync@343718ca0f6d3c44c8438058d4287d6f358c899c
      with:
        source_repo: "https://github.com/longhorn/longhorn.git"
        source_branch: "master"
        destination_branch: "master"
        sync_tags: "false"
        github_token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        skip_rebase_files: "deploy/longhorn-images.txt"
