name: Sync with Upstream

on:
  schedule:
  - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        persist-credentials: false
    - name: repo-sync
      uses: rancher/gh-issue-mgr/github-sync@f8c885d2c9d006903850efca86ae39ae2c9ab535
      with:
        source_repo: "https://github.com/longhorn/longhorn.git"
        source_branch: "v*.*.x"
        destination_branch: "v*.*.x"
        sync_branches: "v1.13.x,v1.12.x"
        sync_tags: "false"
        github_token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
    - name: repo-sync-master
      uses: rancher/gh-issue-mgr/github-sync@f8c885d2c9d006903850efca86ae39ae2c9ab535
      with:
        source_repo: "https://github.com/longhorn/longhorn.git"
        source_branch: "master"
        destination_branch: "master"
        sync_branches: "v1.13.x,v1.12.x,v1.11.x"
        sync_tags: "false"
        github_token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
